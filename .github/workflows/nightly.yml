# Refreshes caches and grades the previous day.
name: nightly
on:
  # schedule:  # off-season
  #   - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: lmb-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install poetry
      - run: poetry sync --no-interaction
      - name: Restore data caches
        uses: actions/cache@v4
        with:
          path: cache
          key: lmb-cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lmb-cache-${{ runner.os }}-
      - name: Restore the current bundle
        uses: actions/cache/restore@v4
        with:
          path: artifacts/current
          key: lmb-bundle-${{ runner.os }}-none
          restore-keys: |
            lmb-bundle-${{ runner.os }}-
          fail-on-cache-miss: true
      - name: Run
        run: poetry run python -m backend nightly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
